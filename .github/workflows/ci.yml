name: Continuous Integration (CI)

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, dev]

jobs:
  backend-ci:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint OpenAPI Contract (Redocly)
        run: npm run lint:yaml

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run Test Suite (17 Suites)
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/hotel_test
          JWT_SECRET: ci_secret_key_at_least_32_bytes_long_12345
          ID_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ID_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
