components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DailyClosingTotals:
      type: object
      properties:
        cash_total:
          type: number
        instapay_total:
          type: number
        vodafone_cash_total:
          type: number
        gross_revenue:
          type: number
        refunds_total:
          type: number
        total_revenue:
          type: number
    CurrentDailyClosing:
      allOf:
      - $ref: '#/components/schemas/DailyClosingTotals'
      - type: object
        properties:
          closing_id:
            type: string
          business_date:
            type: string
          status:
            type: string
            enum:
            - OPEN
            - CLOSED
          opened_at:
            type: string
            nullable: true
          opened_by_staff_id:
            type: string
            nullable: true
          blockers:
            type: object
            properties:
              pending_approvals:
                type: integer
              unreviewed_reports:
                type: integer
              active_shifts:
                type: integer
          can_close:
            type: boolean
    OpenedDailyClosing:
      type: object
      properties:
        closing_id:
          type: string
        business_date:
          type: string
        status:
          type: string
        opened_at:
          type: string
          nullable: true
        opened_by_staff_id:
          type: string
          nullable: true
    ClosedDailyClosing:
      allOf:
      - $ref: '#/components/schemas/DailyClosingTotals'
      - type: object
        properties:
          closing_id:
            type: string
          business_date:
            type: string
          status:
            type: string
          closed_by_staff_id:
            type: string
            nullable: true
          closed_at:
            type: string
