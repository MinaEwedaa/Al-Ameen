openapi: 3.0.3
info:
  title: Al-Amin Manager API
  version: '1.2'
servers:
  - url: /api/v1/manager
security:
  - bearerAuth: []
paths:
  /password-reset-requests:
    get:
      summary: List password reset requests
      operationId: listPasswordResetRequests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, IN_REVIEW, APPROVED, REJECTED]
            default: PENDING
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of password reset requests
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PasswordResetRequestItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /password-reset-requests/{id}/decision:
    patch:
      summary: Decide on a password reset request
      operationId: decidePasswordResetRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetDecisionRequest'
      responses:
        '200':
          description: Request decided successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PasswordResetDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict or already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notifications:
    get:
      summary: List manager notifications
      operationId: listNotifications
      parameters:
        - name: is_read
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    post:
      summary: Mark all unread notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [updated]
                    properties:
                      updated:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/preferences:
    get:
      summary: Get manager notification preferences
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      summary: Update manager notification preferences
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesPatch'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /approvals:
    get:
      summary: List approval requests
      description: Newest first. `status` defaults to `PENDING` (also `APPROVED`, `REJECTED`, `CANCELLED`, `ALL`).
      operationId: listApprovals
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
        - name: request_type
          in: query
          description: REFUND, DISCOUNT, CANCELLATION, UPGRADE or PRICE_OVERRIDE
          schema:
            type: string
        - name: booking_id
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Approval requests
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalRequest'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /approvals/{id}:
    get:
      summary: Approval request detail
      description: For a `PENDING` request `net_paid_amount` is the live net. After a decision it is the final stored value.
      operationId: getApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Approval request
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /approvals/{id}/decision:
    patch:
      summary: Decide on an approval request
      description: |
        `REJECT` needs `manager_comment`. `APPROVE` of `CANCELLATION` or `REFUND` needs `approved_refund_amount` (0 up to the net paid, at most 2 decimals) and runs in one transaction: refund payment, cancellation and settlement for `CANCELLATION`. For the other types the decision is only recorded and `approved_refund_amount` is not allowed.
        A manager cannot decide their own request (`403 CANNOT_APPROVE_OWN_REQUEST`). A second decision returns `409 RECORD_ALREADY_DECIDED`.
      operationId: decideApproval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                approved_refund_amount:
                  type: number
                  minimum: 0
                manager_comment:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided (`RECORD_ALREADY_DECIDED`) or the money path cannot run (no active shift, nothing left to refund, reservation not cancellable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /shift-reports:
    get:
      summary: List shift reports
      description: Newest business date first. Use `business_date` for one day, or `from` and `to` for a range (YYYY-MM-DD).
      operationId: listShiftReports
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: business_date
          in: query
          schema:
            type: string
        - name: shift_id
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: staff_id
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: review_status
          in: query
          schema:
            type: string
            enum: [PENDING_REVIEW, APPROVED, NEEDS_REVIEW]
      responses:
        '200':
          description: Shift reports
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShiftReportListItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /shift-reports/{id}:
    get:
      summary: Shift report detail
      operationId: getShiftReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shift report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ShiftReportDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shift-reports/{id}/review:
    patch:
      summary: Review a shift report
      description: |
        `NEEDS_REVIEW` requires `manager_comment` and removes any stored PDF. `APPROVED` is final: a second review returns `422`. Approving stores the PDF.
      operationId: reviewShiftReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_status]
              properties:
                review_status:
                  type: string
                  enum: [APPROVED, NEEDS_REVIEW]
                manager_comment:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ShiftReportDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The report is already APPROVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /shift-reports/{id}/pdf:
    get:
      summary: Shift report PDF
      description: Served inline with `Cache-Control private, no-store`. Built on request when none is stored.
      operationId: getShiftReportPdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shift-reports/{id}/activities:
    get:
      summary: Audit activities of the report's shift
      description: Only `id`, `action`, `entity`, `entity_id` and `at`. Details and IP are never returned.
      operationId: getShiftReportActivities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activities, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, action, entity, entity_id, at]
                      properties:
                        id:
                          type: string
                        action:
                          type: string
                        entity:
                          type: string
                          nullable: true
                        entity_id:
                          type: string
                          nullable: true
                        at:
                          type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /shift-reports/{id}/handover:
    get:
      summary: Handover summary of the report's shift
      description: The report stores only the count of pending items, so `pending_items` is always an empty list.
      operationId: getShiftReportHandover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Handover
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ShiftReportHandover'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /daily-closings/current:
    get:
      summary: Current business day
      description: |
        Returns the open business day with live totals and blockers, or `data: null` when no day is open.
      operationId: getCurrentDailyClosing
      responses:
        '200':
          description: The open day, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/CurrentDailyClosing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /daily-closings/open:
    post:
      summary: Open the business day
      description: |
        The business date is set by the server (today in Cairo time). Returns `409 ACTIVE_BUSINESS_DAY_EXISTS` when another day is already open.
      operationId: openDailyClosing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '201':
          description: Business day opened
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OpenedDailyClosing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A day is already open, or this date was already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /daily-closings/close:
    post:
      summary: Close the business day
      description: |
        Checks in order: an open day exists, no pending approvals (`PENDING_APPROVALS_EXIST`), no active shift, no `PENDING_REVIEW` reports (`UNREVIEWED_REPORTS_EXIST`).
      operationId: closeDailyClosing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          description: Business day closed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ClosedDailyClosing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No open day, pending approvals, an open shift, or unreviewed reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /daily-closings:
    get:
      summary: List daily closings
      operationId: listDailyClosings
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, CLOSED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated list of closings
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyClosingItem'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /payments:
    get:
      summary: Payments ledger (read only)
      description: |
        Refunds and corrections are negative amounts. `meta.summary` totals the whole filtered set, not just the page.
      operationId: listPayments
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: shift_id
          in: query
          required: false
          schema:
            type: string
        - name: booking_id
          in: query
          required: false
          schema:
            type: string
        - name: method
          in: query
          required: false
          schema:
            type: string
            enum: [CASH, INSTAPAY, VODAFONE_CASH]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [PAYMENT, REFUND, CORRECTION]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated payments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentItem'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        properties:
                          summary:
                            $ref: '#/components/schemas/PaymentsSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DailyClosingTotals:
      type: object
      properties:
        cash_total:
          type: number
        instapay_total:
          type: number
        vodafone_cash_total:
          type: number
        gross_revenue:
          type: number
        refunds_total:
          type: number
        total_revenue:
          type: number
    CurrentDailyClosing:
      allOf:
        - $ref: '#/components/schemas/DailyClosingTotals'
        - type: object
          properties:
            closing_id:
              type: string
            business_date:
              type: string
            status:
              type: string
              enum: [OPEN, CLOSED]
            opened_at:
              type: string
              nullable: true
            opened_by_staff_id:
              type: string
              nullable: true
            blockers:
              type: object
              properties:
                pending_approvals:
                  type: integer
                unreviewed_reports:
                  type: integer
                active_shifts:
                  type: integer
            can_close:
              type: boolean
    OpenedDailyClosing:
      type: object
      properties:
        closing_id:
          type: string
        business_date:
          type: string
        status:
          type: string
        opened_at:
          type: string
          nullable: true
        opened_by_staff_id:
          type: string
          nullable: true
    ClosedDailyClosing:
      allOf:
        - $ref: '#/components/schemas/DailyClosingTotals'
        - type: object
          properties:
            closing_id:
              type: string
            business_date:
              type: string
            status:
              type: string
            closed_by_staff_id:
              type: string
              nullable: true
            closed_at:
              type: string
              nullable: true
    DailyClosingItem:
      allOf:
        - $ref: '#/components/schemas/DailyClosingTotals'
        - type: object
          properties:
            closing_id:
              type: string
            business_date:
              type: string
            status:
              type: string
              enum: [OPEN, CLOSED]
            opened_at:
              type: string
              nullable: true
            opened_by_staff_id:
              type: string
              nullable: true
            closed_at:
              type: string
              nullable: true
            closed_by_staff_id:
              type: string
              nullable: true
            notes:
              type: string
              nullable: true
    PaymentItem:
      type: object
      properties:
        payment_id:
          type: string
        booking_id:
          type: string
          nullable: true
        shift_id:
          type: string
          nullable: true
        method:
          type: string
          enum: [CASH, INSTAPAY, VODAFONE_CASH]
        type:
          type: string
          enum: [PAYMENT, REFUND, CORRECTION]
        amount:
          type: number
        staff_id:
          type: string
          nullable: true
        staff_name:
          type: string
          nullable: true
        approval_id:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
    PaymentsSummary:
      type: object
      properties:
        count:
          type: integer
        cash:
